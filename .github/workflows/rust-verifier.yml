name: rust-verifier

on:
  push:
  pull_request:

jobs:
  verify-certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path rust-verifier/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path rust-verifier/Cargo.toml -- -D warnings
      - name: Verify canonical certificates
        run: >-
          cargo run --release --manifest-path rust-verifier/Cargo.toml --
          certificates/2-2-2-2-7.json
          certificates/2-2-4-7.json
          certificates/4-4-7.json
          certificates/2-7-8.json
